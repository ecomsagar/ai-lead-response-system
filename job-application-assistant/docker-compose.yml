# Runs n8n and Gotenberg (free HTML → PDF converter) together.
# Start with: docker compose up -d   → open http://localhost:5678
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Dubai
      - TZ=Asia/Dubai
    volumes:
      - n8n_data:/home/node/.n8n

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    # Reachable from n8n as http://gotenberg:3000

volumes:
  n8n_data:
